name: Deploy Alayon Merchant to EC2

on:
  push:
    branches:
      - development
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
 
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prefer-offline

      - name: Build project
        run: |
          cd apps/web
          npm run build
        env:
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${{ vars.NEXT_PUBLIC_MEDUSA_BACKEND_URL }}
          NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_DEFAULT_REGION: ${{ vars.NEXT_PUBLIC_DEFAULT_REGION }}
          NEXT_PUBLIC_N8N: ${{ vars.NEXT_PUBLIC_N8N }}
          NEXT_PUBLIC_N8N_WEBHOOK_BASE: ${{ vars.NEXT_PUBLIC_N8N_WEBHOOK_BASE }}
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_MEDUSA_SECRET_KEY: ${{ secrets.NEXT_PUBLIC_MEDUSA_SECRET_KEY }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            
            echo "=== Starting deployment to EC2 ==="
            
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            if ! command -v node &> /dev/null || [ "$(node --version | cut -d. -f1 | tr -d 'v')" -lt 20 ]; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs -y
            fi
            
            if ! command -v pnpm &> /dev/null; then
              sudo npm install -g pnpm@8
            fi
            
            cd ~/apps/alayon-merchant
            
            git pull origin development --no-rebase
            sudo chown -R $USER:$USER ~/apps/alayon-merchant
            
            # Always use --no-frozen-lockfile
            pnpm install --no-frozen-lockfile --prefer-offline
            
            cd apps/web
            
            cat > .env.production << EOF
            NODE_ENV=production
            NEXT_PUBLIC_MEDUSA_BACKEND_URL=${{ vars.NEXT_PUBLIC_MEDUSA_BACKEND_URL }}
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_DEFAULT_REGION=${{ vars.NEXT_PUBLIC_DEFAULT_REGION }}
            NEXT_PUBLIC_N8N=${{ vars.NEXT_PUBLIC_N8N }}
            NEXT_PUBLIC_N8N_WEBHOOK_BASE=${{ vars.NEXT_PUBLIC_N8N_WEBHOOK_BASE }}
            NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_MEDUSA_SECRET_KEY=${{ secrets.NEXT_PUBLIC_MEDUSA_SECRET_KEY }}
            REVALIDATE_SECRET=${{ secrets.REVALIDATE_SECRET }}
            EOF
            
            npm run build
            
            pm2 restart alayon-merchant || pm2 start "npm run start" --name "alayon-merchant" --cwd ~/apps/alayon-merchant/apps/web
            pm2 save
             
            echo "=== Deployment completed! ==="